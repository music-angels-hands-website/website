name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate content manifest
        run: node scripts/generate-content-manifest.js

      - name: Create runtime config
        run: node scripts/generate-runtime-config.js
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://oacathzajaowpcrcmmmb.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare public artifact
        run: |
          mkdir _site
          cp index.html styles.css script.js auth.js volunteer.js volunteer-diagnostics.js volunteer-sessions.mjs config.local.js content-manifest.json robots.txt sitemap.xml _site/
          cp -R assets contents _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
